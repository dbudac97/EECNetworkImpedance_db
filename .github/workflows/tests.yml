name: Julia regression tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.8', '1.10']
    env:
      MPLBACKEND: Agg
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - run: python3 -m pip install -r test/python-requirements.txt
      - name: Instantiate recorded dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.build("PyCall")'
      - name: Run analytical and regression tests
        run: julia --project -e 'using Test; include("test/runtests.jl")'
